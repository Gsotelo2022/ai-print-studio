<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Print Studio - Diseña y compra estampados personalizados</title>
  <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
</head>
<body>
  <!--
    Este es el punto de entrada de toda la aplicación.
    Vue "monta" la app dentro del div #app.
    Todo lo que ves en pantalla es generado por Vue desde main.js → App.vue
  -->
  <div id="app"></div>

  <!--
    Vite inyecta automáticamente los scripts necesarios.
    En desarrollo, carga main.js directamente.
    En producción, carga el bundle compilado.
  -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
